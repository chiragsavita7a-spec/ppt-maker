<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT Maker — Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,Arial,sans-serif;background:linear-gradient(135deg,#2F3C7E 0%,#F96167 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:18px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo-icon{width:68px;height:68px;background:#F96167;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;box-shadow:0 6px 20px rgba(249,97,103,.35)}
h1{text-align:center;font-size:24px;color:#1A1A2E;margin-bottom:5px;font-weight:800}
.sub{text-align:center;color:#999;font-size:13px;margin-bottom:28px}
label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
input{width:100%;padding:12px 14px;border:2px solid #e8ecf8;border-radius:9px;font-size:15px;color:#1A1A2E;outline:none;transition:.2s;margin-bottom:16px;background:#fafbff}
input:focus{border-color:#F96167;background:#fff}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#F96167,#e84d53);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,97,103,.4)}
.error{background:#fff0f0;color:#c0392b;border:1.5px solid #f5c6cb;border-radius:9px;padding:11px 14px;margin-bottom:16px;font-size:13px}
.footer{text-align:center;color:#bbb;font-size:11px;margin-top:24px}
</style></head><body>
<div class="card">
  <div style="text-align:center;margin-bottom:28px">
    <div class="logo-icon">🎓</div>
    <h1>Auto PPT Maker</h1>
    <p class="sub">For Teachers · Sign in to continue</p>
  </div>
  {% if error %}<div class="error">🔒 {{ error }}</div>{% endif %}
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign In →</button>
  </form>
  <p class="footer">Contact your admin if you need access</p>
</div>
</body></html>
