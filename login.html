<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPTex — Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Calibri,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2F3C7E 0%,#6b3fa0 50%,#c85b7a 100%)}
  .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:44px 40px;width:100%;max-width:400px;text-align:center}
  .logo{width:64px;height:64px;background:#F96167;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
  h1{font-size:24px;font-weight:700;color:#1A1A2E;margin-bottom:6px}
  .sub{color:#888;font-size:13px;margin-bottom:28px}
  .error{background:#fff0f0;border:1.5px solid #fcc;color:#c33;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px;text-align:left}
  label{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;text-align:left}
  input{width:100%;padding:12px 14px;border:1.5px solid #dde1f0;border-radius:8px;font-size:15px;color:#1A1A2E;outline:none;transition:.2s;margin-bottom:16px}
  input:focus{border-color:#F96167}
  .btn{width:100%;padding:14px;background:#F96167;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.2px}
  .btn:hover{background:#e84d53}
  .hint{margin-top:16px;color:#aaa;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>PPTex</h1>
  <p class="sub">For Teachers · Sign in to continue</p>
  {% if error %}<div class="error">🔒 {{ error }}</div>{% endif %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter your username" autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
    <button class="btn" type="submit">Sign In →</button>
  </form>
  <p class="hint">Contact your admin if you need access</p>
</div>
</body>
</html>
